# docker-compose.https.yml
services:
  backend:
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set the trusted Docker network CIDR or frontend proxy IP}
  frontend:
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_DIR:-./.certs}:/etc/nginx/certs:ro
